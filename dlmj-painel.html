<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sistema de Organização DLMJ</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
<style>
:root{
  --navy:#0d1f3c;--navy2:#162848;--blue:#1e4080;--accent:#2563b0;--accent-light:#3b82f6;
  --bg:#eef1f8;--white:#ffffff;--border:#dde3ef;--border2:#c8d3e8;
  --text:#0d1f3c;--text2:#5a6a8a;--text3:#9aaac8;
  --meta:#1877f2;--meta-bg:#deeefb;
  --google:#e8710a;--google-bg:#feecd6;
  --both:#7c3aed;--both-bg:#f3eeff;
  --success:#16a34a;--warn:#d97706;
  --shadow:0 1px 2px rgba(13,31,60,.06),0 3px 12px rgba(13,31,60,.07);
  --shadow-lg:0 4px 24px rgba(13,31,60,.13);
  --radius:10px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:0 32px;display:flex;align-items:center;gap:16px;height:58px;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(13,31,60,.3)}
.logo-text{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.1}
.logo-sub{font-size:8.5px;color:rgba(255,255,255,.38);letter-spacing:2.5px;text-transform:uppercase;display:block;margin-top:1px}
.topbar-sep{width:1px;height:22px;background:rgba(255,255,255,.1)}
.topbar-sys{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.8px;text-transform:uppercase;font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.save-pill{font-size:11px;color:rgba(255,255,255,.4);background:rgba(255,255,255,.07);padding:4px 10px;border-radius:20px}
.btn-new{background:var(--accent-light);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s;display:flex;align-items:center;gap:7px}
.btn-new:hover{background:#2d6fd4;transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,130,246,.38)}
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;display:flex;box-shadow:0 1px 4px rgba(13,31,60,.05)}
.nav-tab{padding:15px 22px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:2px solid transparent;font-family:'Sora',sans-serif;transition:all .15s;display:flex;align-items:center;gap:8px}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.nav-tab:hover:not(.active){color:var(--text)}
.nav-icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.page{display:none;padding:28px 32px}.page.active{display:block}
.container{max-width:1240px;margin:0 auto}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.metric{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.metric-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.bar-navy{background:linear-gradient(90deg,#1e4080,#3b82f6)}
.bar-gray{background:linear-gradient(90deg,#94a3b8,#cbd5e1)}
.bar-b1{background:linear-gradient(90deg,#1d4ed8,#60a5fa)}
.bar-b2{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.metric-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;margin-bottom:12px;margin-top:4px}
.icon-navy{background:#e8eef7}.icon-gray{background:#f1f5f9}.icon-b1{background:#dbeafe}.icon-b2{background:#ede9fe}
.metric-label{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:6px}
.metric-val{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.search-wrap{position:relative;width:260px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.search-input{width:100%;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 34px;font-size:12.5px;outline:none;font-family:'Sora',sans-serif;color:var(--text);transition:border .15s,box-shadow .15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,176,.09)}
.plat-filter{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:12.5px;color:var(--text);outline:none;font-family:'Sora',sans-serif;cursor:pointer;min-width:210px;transition:border .15s}
.plat-filter:focus{border-color:var(--accent)}
.kanban{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kcol{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.kcol-head{padding:15px 20px;display:flex;align-items:center;gap:10px}
.kcol-head.active{background:linear-gradient(135deg,#0d1f3c 0%,#1e4080 100%)}
.kcol-head.inactive{background:linear-gradient(135deg,#3d4a5c 0%,#5a6a7e 100%)}
.kcol-title{font-size:13px;font-weight:700;color:#fff;flex:1;letter-spacing:.1px}
.kcol-badge{background:rgba(255,255,255,.18);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:20px}
.kcol-body{background:var(--white);min-height:420px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);transition:background .15s}
.kcol-body.drag-over{background:#eef4ff;border-color:var(--accent)}
.kcol-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:220px;color:var(--text3);font-size:12.5px;gap:10px;padding:40px;text-align:center}
.kcol-empty svg{opacity:.25;width:34px;height:34px;stroke:var(--text3);stroke-width:1.5;fill:none}
.ccard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;cursor:grab;transition:border-color .15s,box-shadow .15s,transform .15s;box-shadow:0 1px 3px rgba(13,31,60,.06)}
.ccard:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(37,99,176,.13);transform:translateY(-1px)}
.ccard.dragging{opacity:.3;transform:scale(.96);box-shadow:none;cursor:grabbing}
.ccard-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.ccard-name{font-weight:700;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.ccard-tipo{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}
.ccard-invest{background:var(--bg);border-radius:7px;padding:8px 11px;margin-bottom:10px;border:1px solid var(--border)}
.invest-row{display:flex;align-items:center;gap:9px;font-size:12px}
.invest-row+.invest-row{margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.invest-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-meta{background:var(--meta)}.dot-google{background:var(--google)}.dot-other{background:var(--accent)}
.invest-plat{font-weight:600;width:50px;font-size:11px;color:var(--text2)}
.invest-val{font-weight:700;color:var(--text);font-size:12.5px}
.ccard-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);gap:8px}
.otim-tag{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.otim-tag svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
.ccard-btns{display:flex;gap:5px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.3px;flex-shrink:0}
.b-meta{background:var(--meta-bg);color:var(--meta)}
.b-google{background:var(--google-bg);color:var(--google)}
.b-ambos{background:var(--both-bg);color:var(--both)}
.b-outro{background:#f1f5f9;color:#475569}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);font-family:'Sora',sans-serif;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:var(--blue)}
.btn-danger{color:#dc2626;border-color:#fecaca}.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px}
.btn-icon{padding:5px 8px}
.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;margin-bottom:22px;padding:7px 15px;border-radius:8px;border:1px solid var(--border);background:var(--white);font-weight:600;font-family:'Sora',sans-serif;transition:all .15s}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:24px;box-shadow:var(--shadow-lg)}
.ch-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.ch-name{font-size:22px;font-weight:800;color:#fff;margin-bottom:7px;letter-spacing:-.3px}
.ch-meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ch-badge{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-size:11px;font-weight:600;padding:3px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
.ch-tipo{font-size:12px;color:rgba(255,255,255,.5)}
.ch-infos{display:grid;gap:12px}
.ch-info-box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:14px 16px}
.ch-info-label{font-size:9.5px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:5px}
.ch-info-val{font-size:15px;font-weight:700;color:#fff}
.two-col{display:grid;grid-template-columns:3fr 2fr;gap:20px}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.panel-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;background:#fafbfd}
.panel-head svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.panel-title{font-size:13px;font-weight:700;color:var(--text);flex:1}
.panel-hint{font-size:10.5px;color:var(--text3)}
.feed-body{height:440px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.feed-body::-webkit-scrollbar{width:3px}
.feed-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.feed-msg{background:#f7f9ff;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;transition:box-shadow .15s}
.feed-msg:hover{box-shadow:0 2px 10px rgba(37,99,176,.09)}
.feed-msg-date{font-size:10.5px;color:var(--text3);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.feed-msg-date svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.feed-msg-text{font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:var(--text)}
.feed-msg-del{opacity:0;margin-top:7px;transition:opacity .15s}
.feed-msg:hover .feed-msg-del{opacity:1}
.feed-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;background:#fafbfd}
.feed-ta{flex:1;font-family:'Sora',sans-serif;font-size:12.5px;color:var(--text);background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 12px;outline:none;resize:none;line-height:1.6;transition:border .15s}
.feed-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,176,.08)}
.notas-body{padding:16px}
.notas-ta{width:100%;font-family:'Sora',sans-serif;font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;outline:none;resize:none;line-height:1.65;min-height:210px;transition:border .15s}
.notas-ta:focus{border-color:var(--accent);background:var(--white);box-shadow:0 0 0 3px rgba(37,99,176,.08)}
.otim-card{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .15s}
.otim-card:hover{box-shadow:var(--shadow-lg)}
.otim-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.otim-card-name{font-weight:700;font-size:13px;color:var(--text);flex:1}
.otim-card-date{font-size:10.5px;color:var(--text3);display:flex;align-items:center;gap:4px}
.otim-card-date svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.otim-card-text{font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:var(--text2)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,20,50,.5);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(13,31,60,.22)}
.modal-head{padding:22px 24px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-icon{width:36px;height:36px;background:var(--navy);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-icon svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal-head h3{font-size:15px;font-weight:700;color:var(--text)}
.modal-body{padding:22px 24px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.frow1{margin-bottom:16px}
label{font-size:11.5px;color:var(--text2);display:block;margin-bottom:5px;font-weight:600;letter-spacing:.2px}
input,select,textarea{font-family:'Sora',sans-serif;font-size:12.5px;color:var(--text);background:#f8faff;border:1px solid var(--border);border-radius:7px;padding:9px 11px;outline:none;width:100%;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--white);box-shadow:0 0 0 3px rgba(37,99,176,.08)}
.invest-section{background:linear-gradient(135deg,#f0f6ff 0%,#f5f0ff 100%);border:1px solid #d5e5fa;border-radius:10px;padding:16px;margin-bottom:16px}
.invest-section-title{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:12px;text-transform:uppercase;letter-spacing:.6px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:#fafbfd;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.no-data{text-align:center;color:var(--text3);padding:44px;font-size:12.5px;line-height:1.8}
.loading{text-align:center;color:var(--text3);padding:56px;font-size:12.5px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="logo-text">DLMJ</div><span class="logo-sub">Assessoria</span></div>
  <div class="topbar-sep"></div>
  <div class="topbar-sys">Sistema de Organização</div>
  <div class="topbar-right">
    <span class="save-pill" id="saveStatus"></span>
    <button class="btn-new" onclick="openModal()" id="btnNovoCliente">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      Novo cliente
    </button>
  </div>
</div>

<div class="nav">
  <button class="nav-tab active" onclick="swTab('clientes')">
    <svg class="nav-icon" viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5"/><path d="M1 13c0-3 2-4.5 5-4.5s5 1.5 5 4.5"/><circle cx="12" cy="5" r="2"/><path d="M14 13c0-2-1.5-3.5-3-3.5"/></svg>
    Clientes
  </button>
  <button class="nav-tab" onclick="swTab('otimizacoes')">
    <svg class="nav-icon" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6h6M5 9h4"/></svg>
    Otimizações
  </button>
</div>

<div class="page active" id="page-clientes">
  <div class="container">
    <div class="mgrid" id="mainMetrics"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5"/><path d="M10 10l2.5 2.5"/></svg>
        <input class="search-input" type="text" id="searchInput" placeholder="Buscar cliente..." oninput="renderKanban()">
      </div>
      <select class="plat-filter" id="filtroPlat" onchange="renderKanban()">
        <option value="">Todas as plataformas</option>
        <option value="Meta Ads">Meta Ads</option>
        <option value="Google Ads">Google Ads</option>
        <option value="Meta + Google">Meta + Google</option>
        <option value="Outro">Outro</option>
      </select>
    </div>
    <div class="kanban">
      <div class="kcol">
        <div class="kcol-head active">
          <svg style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4"/></svg>
          <span class="kcol-title">Clientes Ativos</span>
          <span class="kcol-badge" id="countAtivos">0</span>
        </div>
        <div class="kcol-body" id="colAtivos" ondragover="onDragOver(event)" ondrop="onDrop(event,'Ativo')" ondragleave="onDragLeave(event)"></div>
      </div>
      <div class="kcol">
        <div class="kcol-head inactive">
          <svg style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0" viewBox="0 0 16 16"><rect x="5" y="3" width="2" height="10" rx="1"/><rect x="9" y="3" width="2" height="10" rx="1"/></svg>
          <span class="kcol-title">Clientes Inativos</span>
          <span class="kcol-badge" id="countInativos">0</span>
        </div>
        <div class="kcol-body" id="colInativos" ondragover="onDragOver(event)" ondrop="onDrop(event,'Inativo')" ondragleave="onDragLeave(event)"></div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-otimizacoes">
  <div class="container">
    <div style="margin-bottom:24px">
      <div style="font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px">Todas as Otimizações</div>
      <div style="font-size:12.5px;color:var(--text2)">Histórico completo em ordem cronológica.</div>
    </div>
    <div id="allOtimList"></div>
  </div>
</div>

<div class="page" id="page-cliente">
  <div class="container">
    <button class="back-btn" onclick="goMain()">
      <svg viewBox="0 0 14 14"><path d="M9 11L5 7l4-4"/></svg>
      Voltar para clientes
    </button>
    <div class="ch-hero">
      <div class="ch-top">
        <div>
          <div class="ch-name" id="ch-nome"></div>
          <div class="ch-meta-row" id="ch-meta"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" style="background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.18);color:#fff;font-size:11.5px" onclick="editCurrentCliente()">Editar</button>
          <button class="btn" style="background:rgba(220,38,38,.14);border-color:rgba(220,38,38,.28);color:#fca5a5;font-size:11.5px" onclick="deleteCurrentCliente()">Excluir</button>
        </div>
      </div>
      <div class="ch-infos" id="ch-info"></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head">
          <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6h6M5 9h4"/></svg>
          <span class="panel-title">Otimizações</span>
          <span class="panel-hint">Ctrl+Enter para enviar</span>
        </div>
        <div class="feed-body" id="feedMessages"></div>
        <div class="feed-foot">
          <textarea class="feed-ta" id="feedInput" rows="2" placeholder="Descreva a otimização feita hoje..."></textarea>
          <button class="btn btn-primary" onclick="addFeedMsg()" style="padding:10px 18px;white-space:nowrap;font-size:12px">Enviar</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <svg viewBox="0 0 16 16"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M5 6h6M5 9h4"/></svg>
          <span class="panel-title">Anotações</span>
        </div>
        <div class="notas-body">
          <textarea class="notas-ta" id="notasCliente" placeholder="Observações, contrato, detalhes..."></textarea>
          <button class="btn btn-primary" style="width:100%;margin-top:12px;font-size:12px" onclick="saveNotasCurrent()">Salvar anotações</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="3"/><path d="M2 14c0-4 2.5-6 6-6s6 2 6 6"/></svg></div>
      <h3 id="modalTitle">Novo cliente</h3>
    </div>
    <div class="modal-body">
      <div class="frow1"><label>Nome da empresa *</label><input id="f-nome" type="text" placeholder="Ex: Auto Prime Veículos"></div>
      <div class="frow">
        <div><label>Plataforma</label>
          <select id="f-plat" onchange="updateInvestFields()">
            <option>Meta Ads</option><option>Google Ads</option><option>Meta + Google</option><option>Outro</option>
          </select>
        </div>
        <div><label>Tipo de campanha</label><input id="f-tipo" placeholder="Ex: Tráfego pago"></div>
      </div>
      <div class="invest-section">
        <div class="invest-section-title">Investimento diário em tráfego</div>
        <div id="investInputs"></div>
      </div>
      <div class="frow1"><label>Início do ciclo</label><input id="f-ciclo" type="date"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar" onclick="saveCliente()">Salvar cliente</button>
    </div>
  </div>
</div>

<script>
var SB_URL = 'https://hxobanafylacedvoycka.supabase.co';
var SB_KEY = 'sb_publishable_wgGesLKU26p4xE-2zt_pHQ_SDFMIVZB';
var HEADERS = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation'};
var clientes = [], editIdx = -1, currentIdx = -1, dragId = null;
var pCls = {'Meta Ads':'b-meta','Google Ads':'b-google','Meta + Google':'b-ambos','Outro':'b-outro'};

function status(msg, ok) {
  if (ok === undefined) ok = true;
  var el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.style.color = ok ? 'rgba(255,255,255,.4)' : '#fca5a5';
  if (ok) setTimeout(function(){ el.textContent = ''; }, 3000);
}

function api(method, path, data) {
  return axios({method: method, url: SB_URL + '/rest/v1/' + path, headers: HEADERS, data: data})
    .then(function(r){ return r.data; })
    .catch(function(e){ status('Erro: ' + e.message, false); throw e; });
}

function loadClientes() {
  document.getElementById('colAtivos').innerHTML = '<div class="loading"><span class="spinner"></span>Carregando...</div>';
  return api('get', 'clientes?order=created_at.asc&select=*').then(function(data){
    clientes = data || [];
    renderMain();
  });
}

function fmtDatetime(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function lastOtimLabel(c) {
  var feed = c.feed || [];
  if (!feed.length) return '<span style="color:var(--text3);font-size:11px">Sem registros</span>';
  var d = new Date(feed[feed.length-1].ts), diff = Math.round((new Date() - d) / 86400000);
  if (diff === 0) return '<span style="color:var(--success);font-weight:700;font-size:11px">Hoje</span>';
  if (diff === 1) return '<span style="color:var(--text2);font-size:11px">Ontem</span>';
  if (diff <= 7) return '<span style="color:var(--warn);font-size:11px">' + diff + 'd atrás</span>';
  return '<span style="color:var(--text3);font-size:11px">' + d.toLocaleDateString('pt-BR') + '</span>';
}

function investHTML(c) {
  var plat = c.plat || '', rows = '';
  if ((plat === 'Meta Ads' || plat === 'Meta + Google') && c.vlr_meta)
    rows += '<div class="invest-row"><span class="invest-dot dot-meta"></span><span class="invest-plat">Meta</span><span class="invest-val">R$' + parseFloat(c.vlr_meta).toLocaleString('pt-BR') + '/dia</span></div>';
  if ((plat === 'Google Ads' || plat === 'Meta + Google') && c.vlr_google)
    rows += '<div class="invest-row"><span class="invest-dot dot-google"></span><span class="invest-plat">Google</span><span class="invest-val">R$' + parseFloat(c.vlr_google).toLocaleString('pt-BR') + '/dia</span></div>';
  if (plat === 'Outro' && c.vlr_outro)
    rows += '<div class="invest-row"><span class="invest-dot dot-other"></span><span class="invest-val">R$' + parseFloat(c.vlr_outro).toLocaleString('pt-BR') + '/dia</span></div>';
  return rows ? '<div class="ccard-invest">' + rows + '</div>' : '';
}

function swTab(t) {
  document.querySelectorAll('.nav-tab').forEach(function(el, i){ el.classList.toggle('active', ['clientes','otimizacoes'][i] === t); });
  ['clientes','otimizacoes'].forEach(function(n){ document.getElementById('page-'+n).classList.toggle('active', n === t); });
  document.getElementById('page-cliente').classList.remove('active');
  document.getElementById('btnNovoCliente').style.display = t === 'clientes' ? '' : 'none';
  if (t === 'otimizacoes') renderAllOtim();
}

function renderMain() { renderMetrics(); renderKanban(); }

function renderMetrics() {
  var ativos = clientes.filter(function(c){ return (c.status||'Ativo') === 'Ativo'; });
  var inativos = clientes.filter(function(c){ return c.status === 'Inativo'; });
  var tMeta = ativos.filter(function(c){ return c.plat==='Meta Ads'||c.plat==='Meta + Google'; }).length;
  var tGoogle = ativos.filter(function(c){ return c.plat==='Google Ads'||c.plat==='Meta + Google'; }).length;
  document.getElementById('mainMetrics').innerHTML =
    '<div class="metric"><div class="metric-bar bar-navy"></div><div class="metric-icon icon-navy"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1e4080" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><path d="M1 13c0-3 2-4.5 5-4.5s5 1.5 5 4.5"/><circle cx="12" cy="5" r="2"/><path d="M14 13c0-2-1.5-3.5-3-3.5"/></svg></div><div class="metric-label">Clientes ativos</div><div class="metric-val">' + ativos.length + '</div></div>' +
    '<div class="metric"><div class="metric-bar bar-gray"></div><div class="metric-icon icon-gray"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="2" height="10" rx="1"/><rect x="9" y="3" width="2" height="10" rx="1"/></svg></div><div class="metric-label">Clientes inativos</div><div class="metric-val" style="color:#64748b">' + inativos.length + '</div></div>' +
    '<div class="metric"><div class="metric-bar bar-b1"></div><div class="metric-icon icon-b1"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1877f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8h6M8 5v6"/></svg></div><div class="metric-label">Em Meta Ads</div><div class="metric-val" style="color:#1877f2">' + tMeta + '</div></div>' +
    '<div class="metric"><div class="metric-bar bar-b2"></div><div class="metric-icon icon-b2"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#e8710a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg></div><div class="metric-label">Em Google Ads</div><div class="metric-val" style="color:#e8710a">' + tGoogle + '</div></div>';
}

function renderKanban() {
  var q = (document.getElementById('searchInput') ? document.getElementById('searchInput').value : '').toLowerCase();
  var fp = document.getElementById('filtroPlat') ? document.getElementById('filtroPlat').value : '';
  var ativos = clientes.filter(function(c){ return (c.status||'Ativo')==='Ativo' && (!q||c.nome.toLowerCase().includes(q)) && (!fp||c.plat===fp); });
  var inativos = clientes.filter(function(c){ return c.status==='Inativo' && (!q||c.nome.toLowerCase().includes(q)) && (!fp||c.plat===fp); });
  document.getElementById('countAtivos').textContent = ativos.length;
  document.getElementById('countInativos').textContent = inativos.length;
  document.getElementById('colAtivos').innerHTML = ativos.length ? ativos.map(cardHTML).join('') : '<div class="kcol-empty"><svg viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5"/><path d="M1 13c0-3 2-4.5 5-4.5s5 1.5 5 4.5"/></svg><div>Nenhum cliente ativo</div></div>';
  document.getElementById('colInativos').innerHTML = inativos.length ? inativos.map(cardHTML).join('') : '<div class="kcol-empty"><svg viewBox="0 0 16 16"><rect x="5" y="3" width="2" height="10" rx="1"/><rect x="9" y="3" width="2" height="10" rx="1"/></svg><div>Arraste clientes inativos aqui</div></div>';
}

function cardHTML(c) {
  var i = clientes.indexOf(c), cls = pCls[c.plat] || 'b-outro';
  return '<div class="ccard" draggable="true" id="card-' + c.id + '" ondragstart="onDragStart(event,\'' + c.id + '\')" ondragend="onDragEnd()">' +
    '<div class="ccard-header">' +
      '<div style="flex:1;min-width:0"><div class="ccard-name">' + c.nome + '</div><div class="ccard-tipo">' + (c.tipo||'—') + '</div></div>' +
      '<span class="badge ' + cls + '">' + (c.plat||'—') + '</span>' +
    '</div>' +
    investHTML(c) +
    '<div class="ccard-footer">' +
      '<div class="otim-tag"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5"/><path d="M6 4v2.5l1.5 1.5"/></svg>' + lastOtimLabel(c) + '</div>' +
      '<div class="ccard-btns">' +
        '<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();openCliente(' + i + ')">Abrir</button>' +
        '<button class="btn btn-sm btn-icon" onclick="event.stopPropagation();openModal(' + i + ')" title="Editar"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2l2 2-6 6H2V8l6-6z"/></svg></button>' +
        '<button class="btn btn-sm btn-icon btn-danger" onclick="event.stopPropagation();deleteCliente(' + i + ')" title="Excluir"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 3h8M4 3V2h4v1M5 5.5v3M7 5.5v3M3 3l.5 7h5l.5-7"/></svg></button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function onDragStart(e, id) { dragId = id; setTimeout(function(){ var el = document.getElementById('card-'+id); if(el) el.classList.add('dragging'); }, 0); }
function onDragEnd() { if(dragId){ var el = document.getElementById('card-'+dragId); if(el) el.classList.remove('dragging'); } }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, novoStatus) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (!dragId) return;
  var idx = clientes.findIndex(function(c){ return c.id === dragId; });
  if (idx < 0 || (clientes[idx].status||'Ativo') === novoStatus) { dragId = null; return; }
  clientes[idx].status = novoStatus;
  renderKanban(); renderMetrics();
  api('patch', 'clientes?id=eq.' + dragId, {status: novoStatus}).then(function(){ status('Status atualizado ✓'); });
  dragId = null;
}

function openCliente(idx) {
  currentIdx = idx;
  document.getElementById('page-clientes').classList.remove('active');
  document.getElementById('page-otimizacoes').classList.remove('active');
  document.getElementById('page-cliente').classList.add('active');
  document.getElementById('btnNovoCliente').style.display = 'none';
  document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
  renderClientePage();
}

function goMain() {
  document.getElementById('page-cliente').classList.remove('active');
  document.getElementById('page-clientes').classList.add('active');
  document.getElementById('btnNovoCliente').style.display = '';
  document.querySelectorAll('.nav-tab').forEach(function(el, i){ el.classList.toggle('active', i === 0); });
  currentIdx = -1; loadClientes();
}

function renderClientePage() {
  var c = clientes[currentIdx];
  document.getElementById('ch-nome').textContent = c.nome;
  document.getElementById('ch-meta').innerHTML =
    '<span class="ch-badge">' + (c.plat||'—') + '</span>' +
    (c.tipo ? '<span class="ch-tipo">' + c.tipo + '</span>' : '') +
    '<span class="ch-badge">' + (c.status||'Ativo') + '</span>';
  var boxes = '<div class="ch-info-box"><div class="ch-info-label">Plataforma</div><div class="ch-info-val">' + (c.plat||'—') + '</div></div>';
  if (c.plat === 'Meta Ads' || c.plat === 'Meta + Google')
    boxes += '<div class="ch-info-box"><div class="ch-info-label">Meta — invest./dia</div><div class="ch-info-val">' + (c.vlr_meta ? 'R$'+parseFloat(c.vlr_meta).toLocaleString('pt-BR') : '—') + '</div></div>';
  if (c.plat === 'Google Ads' || c.plat === 'Meta + Google')
    boxes += '<div class="ch-info-box"><div class="ch-info-label">Google — invest./dia</div><div class="ch-info-val">' + (c.vlr_google ? 'R$'+parseFloat(c.vlr_google).toLocaleString('pt-BR') : '—') + '</div></div>';
  if (c.plat === 'Outro' && c.vlr_outro)
    boxes += '<div class="ch-info-box"><div class="ch-info-label">Invest./dia</div><div class="ch-info-val">R$' + parseFloat(c.vlr_outro).toLocaleString('pt-BR') + '</div></div>';
  boxes += '<div class="ch-info-box"><div class="ch-info-label">Início do ciclo</div><div class="ch-info-val">' + (c.ciclo ? new Date(c.ciclo+'T12:00:00').toLocaleDateString('pt-BR') : '—') + '</div></div>';
  var count = (boxes.match(/ch-info-box/g)||[]).length;
  var grid = document.getElementById('ch-info');
  grid.style.gridTemplateColumns = 'repeat(' + count + ',1fr)';
  grid.innerHTML = boxes;
  renderFeed();
  document.getElementById('notasCliente').value = c.notas || '';
}

function renderFeed() {
  var c = clientes[currentIdx], msgs = c.feed || [];
  var el = document.getElementById('feedMessages');
  if (!msgs.length) { el.innerHTML = '<div class="no-data">Nenhuma otimização registrada ainda.<br><span style="font-size:11.5px">Use o campo abaixo para começar.</span></div>'; return; }
  el.innerHTML = msgs.slice().reverse().map(function(m, ri){
    var i = msgs.length - 1 - ri;
    return '<div class="feed-msg">' +
      '<div class="feed-msg-date"><svg viewBox="0 0 11 11"><rect x="1" y="2" width="9" height="8" rx="1.5"/><path d="M3.5 1v2M7.5 1v2M1 5h9"/></svg>' + fmtDatetime(m.ts) + '</div>' +
      '<div class="feed-msg-text">' + escHtml(m.text) + '</div>' +
      '<div class="feed-msg-del"><button class="btn btn-sm btn-danger" onclick="deleteFeedMsg(' + i + ')">Apagar</button></div>' +
    '</div>';
  }).join('');
}

function addFeedMsg() {
  var inp = document.getElementById('feedInput'), text = inp.value.trim();
  if (!text) return;
  var c = clientes[currentIdx];
  var feed = (c.feed || []).concat([{ts: new Date().toISOString(), text: text}]);
  inp.value = ''; status('Salvando...');
  api('patch', 'clientes?id=eq.' + c.id, {feed: feed}).then(function(){
    clientes[currentIdx].feed = feed; status('Salvo ✓'); renderFeed();
  });
}

function deleteFeedMsg(i) {
  if (!confirm('Apagar esta otimização?')) return;
  var c = clientes[currentIdx], feed = (c.feed||[]).slice();
  feed.splice(i, 1);
  api('patch', 'clientes?id=eq.' + c.id, {feed: feed}).then(function(){
    clientes[currentIdx].feed = feed; status('Removido ✓'); renderFeed();
  });
}

function saveNotasCurrent() {
  var notas = document.getElementById('notasCliente').value, c = clientes[currentIdx];
  api('patch', 'clientes?id=eq.' + c.id, {notas: notas}).then(function(){
    clientes[currentIdx].notas = notas; status('Anotações salvas ✓');
  });
}

function deleteCurrentCliente() {
  if (!confirm('Excluir ' + clientes[currentIdx].nome + '?')) return;
  var id = clientes[currentIdx].id;
  api('delete', 'clientes?id=eq.' + id).then(function(){
    clientes.splice(currentIdx, 1); status('Excluído ✓'); goMain();
  });
}

function deleteCliente(idx) {
  if (!confirm('Excluir ' + clientes[idx].nome + '?')) return;
  api('delete', 'clientes?id=eq.' + clientes[idx].id).then(function(){
    clientes.splice(idx, 1); status('Excluído ✓'); renderMain();
  });
}

function editCurrentCliente() { openModal(currentIdx); }

function renderAllOtim() {
  var all = [];
  clientes.forEach(function(c){ (c.feed||[]).forEach(function(m){ all.push({ts:m.ts, text:m.text, nome:c.nome, plat:c.plat}); }); });
  all.sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  var el = document.getElementById('allOtimList');
  if (!all.length) { el.innerHTML = '<div class="no-data">Nenhuma otimização registrada ainda.</div>'; return; }
  el.innerHTML = all.map(function(m){
    return '<div class="otim-card">' +
      '<div class="otim-card-head"><span class="otim-card-name">' + m.nome + '</span><span class="badge ' + (pCls[m.plat]||'b-outro') + '">' + (m.plat||'—') + '</span><span class="otim-card-date"><svg viewBox="0 0 11 11"><rect x="1" y="2" width="9" height="8" rx="1.5"/><path d="M3.5 1v2M7.5 1v2M1 5h9"/></svg>' + fmtDatetime(m.ts) + '</span></div>' +
      '<div class="otim-card-text">' + escHtml(m.text) + '</div>' +
    '</div>';
  }).join('');
}

function updateInvestFields() {
  var plat = document.getElementById('f-plat').value, html = '';
  if (plat === 'Meta Ads' || plat === 'Meta + Google')
    html += '<div style="margin-bottom:' + (plat==='Meta + Google'?'12px':'0') + '"><label>Meta Ads — Valor diário (R$)</label><input id="f-vlr-meta" type="number" placeholder="Ex: 50" min="0"></div>';
  if (plat === 'Google Ads' || plat === 'Meta + Google')
    html += '<div><label>Google Ads — Valor diário (R$)</label><input id="f-vlr-google" type="number" placeholder="Ex: 30" min="0"></div>';
  if (plat === 'Outro')
    html += '<div><label>Valor diário (R$)</label><input id="f-vlr-outro" type="number" placeholder="Ex: 100" min="0"></div>';
  document.getElementById('investInputs').innerHTML = html;
  if (editIdx >= 0) {
    var c = clientes[editIdx];
    if (document.getElementById('f-vlr-meta')) document.getElementById('f-vlr-meta').value = c.vlr_meta || '';
    if (document.getElementById('f-vlr-google')) document.getElementById('f-vlr-google').value = c.vlr_google || '';
    if (document.getElementById('f-vlr-outro')) document.getElementById('f-vlr-outro').value = c.vlr_outro || '';
  }
}

function openModal(idx) {
  if (idx === undefined) idx = -1;
  editIdx = idx;
  var c = idx >= 0 ? clientes[idx] : {};
  document.getElementById('modalTitle').textContent = idx >= 0 ? 'Editar cliente' : 'Novo cliente';
  document.getElementById('f-nome').value = c.nome || '';
  document.getElementById('f-plat').value = c.plat || 'Meta Ads';
  document.getElementById('f-tipo').value = c.tipo || '';
  document.getElementById('f-ciclo').value = c.ciclo || '';
  updateInvestFields();
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function saveCliente() {
  var nome = document.getElementById('f-nome').value.trim();
  if (!nome) { alert('Informe o nome do cliente'); return; }
  var btn = document.getElementById('btnSalvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  var obj = {
    nome: nome,
    status: editIdx >= 0 ? (clientes[editIdx].status || 'Ativo') : 'Ativo',
    plat: document.getElementById('f-plat').value,
    tipo: document.getElementById('f-tipo').value.trim(),
    ciclo: document.getElementById('f-ciclo').value || null,
    vlr_meta: document.getElementById('f-vlr-meta') ? (parseFloat(document.getElementById('f-vlr-meta').value)||null) : null,
    vlr_google: document.getElementById('f-vlr-google') ? (parseFloat(document.getElementById('f-vlr-google').value)||null) : null,
    vlr_outro: document.getElementById('f-vlr-outro') ? (parseFloat(document.getElementById('f-vlr-outro').value)||null) : null
  };
  var p;
  if (editIdx >= 0) {
    p = api('patch', 'clientes?id=eq.' + clientes[editIdx].id, obj).then(function(){ Object.assign(clientes[editIdx], obj); });
  } else {
    var newObj = JSON.parse(JSON.stringify(obj));
    newObj.feed = []; newObj.historico = []; newObj.notas = '';
    p = api('post', 'clientes', newObj).then(function(res){ clientes.push(res[0]); });
  }
  p.then(function(){
    status('Salvo ✓'); closeModal();
    btn.disabled = false; btn.textContent = 'Salvar cliente';
    if (currentIdx >= 0) renderClientePage(); else renderMain();
  }).catch(function(){ btn.disabled = false; btn.textContent = 'Salvar cliente'; });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.activeElement === document.getElementById('feedInput')) addFeedMsg();
});
document.getElementById('modalBg').addEventListener('click', function(e){
  if (e.target === document.getElementById('modalBg')) closeModal();
});
